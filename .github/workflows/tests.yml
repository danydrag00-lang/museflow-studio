name: Test Museflow Studio
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog-audio/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
